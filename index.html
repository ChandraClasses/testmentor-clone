<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestMentor - Realistic Government Exam Typing Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #e2e8f0;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --book-bg: #fdfbf7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

        header { background: #ffffff; border-bottom: 2px solid #cbd5e1; position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1300px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .badge-exam { background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

        .container { max-width: 1300px; margin: 1.5rem auto; padding: 0 1rem; }

        .selection-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .select-group { display: flex; flex-direction: column; gap: 5px; }
        .select-group label { font-weight: 700; font-size: 0.88rem; color: var(--primary); }

        select.custom-select {
            padding: 0.55rem 1rem;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            background: white;
        }
        select.custom-select:focus { border-color: var(--primary-light); }

        .rules-banner {
            background: #eff6ff;
            border-left: 4px solid var(--primary-light);
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            color: #1e40af;
        }

        .exam-top-bar {
            background: #0f172a;
            color: white;
            padding: 0.9rem 1.5rem;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Roboto Mono', monospace;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats-group { display: flex; gap: 1.8rem; font-size: 0.95rem; }
        .stat-box span { color: #38bdf8; font-weight: bold; }

        .book-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 480px;
        }

        .book-page-left {
            background: var(--book-bg);
            border-right: 2px dashed var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .passage-box {
            height: 380px;
            overflow-y: auto;
            font-family: 'Roboto Mono', monospace;
            font-size: 1.05rem;
            line-height: 1.9;
            user-select: none;
            white-space: pre-wrap;
            word-break: break-all;
            padding-right: 8px;
            color: #1e293b;
        }

        /* REAL EXAM MODE: No Green/Red Colors. Cursor shows simple active indicator */
        .passage-box span.typed { color: #0f172a; font-weight: 500; }
        .passage-box span.current { border-bottom: 3px solid var(--primary-light); background-color: #e2e8f0; }

        .book-page-right {
            background: #ffffff;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        textarea.typing-textarea {
            width: 100%;
            height: 380px;
            padding: 1rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 1.05rem;
            line-height: 1.9;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            resize: none;
            background: #fafafa;
            color: #0f172a;
        }
        textarea.typing-textarea:focus {
            border-color: var(--primary-light);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }

        .btn {
            padding: 0.65rem 1.6rem;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-start { background: var(--primary-light); color: white; }
        .btn-start:hover { background: var(--primary); }
        .btn-reset { background: #64748b; color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .history-section {
            margin-top: 2.5rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .table-responsive { overflow-x: auto; }

        table.history-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
        table.history-table th, table.history-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        table.history-table th { background: #f8fafc; font-weight: 700; color: var(--primary); }

        .badge-pass { background: #dcfce7; color: #15803d; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .badge-fail { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 4px; font-weight: 700; }

        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .result-modal {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 30px;
            margin: 1rem 0;
            text-transform: uppercase;
        }

        .status-pass { background: #dcfce7; color: #15803d; border: 2px solid #16a34a; }
        .status-fail { background: #fee2e2; color: #b91c1c; border: 2px solid #dc2626; }

        .eval-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
            text-align: left;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
        }

        .eval-item label { font-size: 0.8rem; color: var(--text-muted); display: block; }
        .eval-item val { font-weight: 700; font-size: 1.1rem; }

        @media (max-width: 900px) {
            .book-container { grid-template-columns: 1fr; }
            .book-page-left { border-right: none; border-bottom: 2px dashed var(--border); }
        }
    </style>
</head>

        </div>
    </header>
